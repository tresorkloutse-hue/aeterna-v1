name: Adresses Cloudflare
on:
  push:
    paths: [".github/workflows/sonde.yml"]
permissions:
  contents: write
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          : > adresses.txt
          for s in tresorkloutse tresorkloutse-hue tresor-kloutse tresorkloutse1 tresorkloutsehue kloutse tresor; do
            for w in mes-notes-de-cours monrepetiteur clipper-pro polymatch; do
              c=$(curl -s -o /dev/null -w '%{http_code}' -m 10 "https://$w.$s.workers.dev/")
              echo "$c https://$w.$s.workers.dev/" >> adresses.txt
            done
          done
          cat adresses.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add adresses.txt && git commit -m "Adresses des sites" && git push
