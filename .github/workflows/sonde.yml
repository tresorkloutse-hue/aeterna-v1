name: Verif domaine
on:
  push:
    paths: [".github/workflows/sonde.yml"]
permissions:
  contents: write
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          {
          echo "== dig"; dig +short A polymatch.org @ns1.vercel-dns.com; dig +short AAAA polymatch.org @ns1.vercel-dns.com; dig +short www.polymatch.org @ns1.vercel-dns.com
          echo "== http"; curl -sI -m 15 http://polymatch.org/ | head -5 || true
          echo "== https"; curl -sI -m 15 https://polymatch.org/ | head -5 || true
          echo "== titre"; curl -sL -m 15 http://polymatch.org/ | grep -o "<title>[^<]*" | head -1 || true
          } > domaine.txt 2>&1
          cat domaine.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add domaine.txt && git commit -m "Verif domaine" && git push
