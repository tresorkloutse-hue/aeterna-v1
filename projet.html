<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><title>Fiche projet : Polymatch</title><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="theme-color" content="#136577">
<link rel="stylesheet" href="style.css"></head>
<body>
<a class="pm-skip" href="#contenu">Aller au contenu</a>
<div id="pm-nav"></div>
<main id="contenu" tabindex="-1">
<div class="wrap" id="pm-content"><p class="empty-note">Chargement…</p></div>
</main>
<div id="pm-footer"></div>
<script src="outils/supabase-js-2.117.1.js"></script>
<script src="app.js"></script>
<script>
const contentEl=document.getElementById("pm-content");const statusLabels={open:"ouvert",in_progress:"en cours",filled:"pourvu",closed:"clos"};const appStatusLabels={pending:"en attente",accepted:"acceptée",declined:"refusée",withdrawn:"retirée"};
function projectId(){return new URLSearchParams(window.location.search).get("id");}
async function loadApplications(project,session){const{data,error}=await client.from("applications").select("id,message,status,created_at,applicant_id,profiles(full_name,discipline)").eq("project_id",project.id).order("created_at",{ascending:false});if(error){return '<div class="msg-box error">'+pmEscape(error.message)+"</div>";}const isOwner=session&&session.user.id===project.owner_id;if(!data||data.length===0){return '<p class="empty-note">Aucune candidature pour l’instant.</p>';}return data.map((a)=>{const applicant=pmAuthorLink(a.applicant_id,a.profiles&&a.profiles.full_name,"candidat");let actions="";if(isOwner&&a.status==="pending"){actions='<div class="actions"><button class="btn accent small" data-app-accept="'+a.id+'">Accepter</button><button class="btn secondary small" data-app-decline="'+a.id+'">Refuser</button><a class="btn secondary small" href="messagerie.html?to='+a.applicant_id+'&project='+project.id+'">Écrire</a></div>';}else if(isOwner){actions='<div class="actions"><a class="btn secondary small" href="messagerie.html?to='+a.applicant_id+'&project='+project.id+'">Écrire</a></div>';}return('<div class="app-row"><strong>'+applicant+'</strong> <span class="badge '+a.status+'">'+pmT(appStatusLabels[a.status])+"</span>"+(a.profiles&&a.profiles.discipline?'<div class="meta">'+pmEscape(a.profiles.discipline)+"</div>":"")+(a.message?"<p>"+pmEscape(a.message)+"</p>":"")+'<div class="meta">'+pmFormatDate(a.created_at)+"</div>"+actions+"</div>");}).join("");}
async function attachApplicationActions(project,session){contentEl.querySelectorAll("[data-app-accept]").forEach((btn)=>{btn.addEventListener("click",async()=>{btn.disabled=true;const r=await client.from("applications").update({status:"accepted"}).eq("id",btn.getAttribute("data-app-accept"));if(r.error){alert(r.error.message);btn.disabled=false;return;}render(session);});});contentEl.querySelectorAll("[data-app-decline]").forEach((btn)=>{btn.addEventListener("click",async()=>{btn.disabled=true;await client.from("applications").update({status:"declined"}).eq("id",btn.getAttribute("data-app-decline"));render(session);});});}
async function applyZone(project,session){if(!session){return '<p class="empty-note"><a href="connexion.html?next='+encodeURIComponent("projet.html?id="+project.id)+'">Connecte-toi</a> pour postuler à ce projet.</p>';}if(session.user.id===project.owner_id){return "";}const{data:mine}=await client.from("applications").select("id,status").eq("project_id",project.id).eq("applicant_id",session.user.id).maybeSingle();if(mine&&mine.status==="accepted"){return('<p class="empty-note">Ta candidature est <span class="badge accepted">acceptée</span>. <button class="btn secondary small" id="pm-withdraw" data-app-id="'+mine.id+'">Retirer ma candidature</button></p><div class="cta-row left"><a class="btn accent" href="espace.html?project='+project.id+'">Ouvrir l’espace de travail partagé</a><a class="btn secondary" href="attestation.html?project='+project.id+'&partner='+session.user.id+'">Mon attestation</a><a class="btn secondary" href="collaborations.html">Mes collaborations</a><a class="btn secondary" href="messagerie.html?to='+project.owner_id+'&project='+project.id+'">Écrire au porteur</a></div>');}if(mine&&mine.status==="pending"){return('<p class="empty-note">Ta candidature est <span class="badge pending">en attente</span>. <button class="btn secondary small" id="pm-withdraw" data-app-id="'+mine.id+'">Retirer ma candidature</button></p><div class="cta-row left"><a class="btn secondary" href="messagerie.html?to='+project.owner_id+'&project='+project.id+'">Écrire au porteur</a></div>');}const reapply=mine?' data-reapply-id="'+mine.id+'"':"";const priorNote=mine?'<p class="empty-note">Ta précédente candidature était <span class="badge '+mine.status+'">'+pmT(appStatusLabels[mine.status])+"</span>. Tu peux postuler à nouveau.</p>":"";return(priorNote+'<div class="example"><div class="ex-tag">Exemple de candidature qui reçoit une réponse</div><p>« Je suis en Master 2 de mathématiques appliquées, je travaille sur les modèles de diffusion depuis deux ans mais je n’ai jamais eu de données de terrain entre les mains. Concrètement je peux construire le graphe à partir de tes messages, tester deux ou trois modèles de propagation et te sortir des visualisations lisibles. Je peux y consacrer environ 4 heures par semaine jusqu’en juin. »</p></div><form class="card" id="pm-apply-form"'+reapply+'><label for="pm-apply-message">Pourquoi ce projet t’intéresse, et ce que tu apportes</label><textarea id="pm-apply-message" placeholder="Ta discipline, ce que tu sais faire de concret sur ce sujet, et le temps que tu peux y consacrer."></textarea><p class="field-hint">Sois concret : ce que tu ferais, avec quels outils, en combien de temps.</p><div class="form-actions"><button type="submit" class="btn accent" id="pm-apply-submit">Envoyer ma candidature</button></div></form><p class="field-hint">Une question avant de te lancer ? <a class="author-link" href="messagerie.html?to='+project.owner_id+'&project='+project.id+'">Écris au porteur</a>, ça n’engage à rien.</p>');}
function attachWithdrawButton(project,session){const btn=document.getElementById("pm-withdraw");if(!btn)return;btn.addEventListener("click",async()=>{btn.disabled=true;const{error}=await client.from("applications").update({status:"withdrawn"}).eq("id",btn.getAttribute("data-app-id"));if(error){alert(error.message);btn.disabled=false;return;}render(session);});}
function attachApplyForm(project,session){const form=document.getElementById("pm-apply-form");if(!form)return;form.addEventListener("submit",async(e)=>{e.preventDefault();const submitBtn=document.getElementById("pm-apply-submit");submitBtn.disabled=true;const reapplyId=form.getAttribute("data-reapply-id");const message=document.getElementById("pm-apply-message").value.trim()||null;const{error}=reapplyId?await client.from("applications").update({status:"pending",message:message}).eq("id",reapplyId):await client.from("applications").insert({project_id:project.id,applicant_id:session.user.id,message:message});if(error){alert(error.message);submitBtn.disabled=false;return;}render(session);});}
async function render(session){const id=projectId();if(!id){contentEl.innerHTML='<p class="empty-note">Projet introuvable.</p>';return;}const{data:project,error}=await client.from("projects").select("id,title,description,discipline,skills_needed,duration,status,created_at,owner_id,owner_type,framework,places,compensation,deadline,profiles(full_name,university,account_type,org_kind,country,contact_name,website)").eq("id",id).maybeSingle();if(error||!project){contentEl.innerHTML='<p class="empty-note">Projet introuvable, ou réservé aux membres connectés.</p>';return;}const owner=pmAuthorLink(project.owner_id,project.profiles&&project.profiles.full_name);const isOwner=session&&session.user.id===project.owner_id;const tags=(project.skills_needed||[]).map((s)=>'<span class="tag">'+pmEscape(s)+"</span>").join("");const applyHtml=await applyZone(project,session);const appsHtml=isOwner||session?await loadApplications(project,session):"";let ownerWorkspaceHtml="";
if(isOwner){
const ac=await client.from("applications").select("applicant_id,accepted_at,profiles(full_name,discipline)").eq("project_id",project.id).eq("status","accepted").order("accepted_at",{ascending:true});
const team=ac.data||[];
if(team.length>0){
const limit=(project.owner_type==="institution")?(project.places||null):5;
const restant=(limit!==null)?Math.max(0,limit-team.length):null;
ownerWorkspaceHtml='<div class="id-card"><p class="ex-label" style="margin-top:0;">L’équipe de ce projet</p>'
+'<p class="field-hint">'+pmT((team.length+1)>1?"{n} personnes au travail, toi compris.":"{n} personne au travail, toi compris.").replace("{n}",team.length+1)
+(restant!==null?(restant>0?(" "+pmT(restant>1?"Encore {n} places disponibles.":"Encore {n} place disponible.").replace("{n}",restant)):" "+pmT("Plus de place disponible : les candidatures suivantes ne peuvent plus être acceptées.")):"")+"</p>"
+team.map(function(t){var n=(t.profiles&&t.profiles.full_name)||"Partenaire";
return '<div class="c-line"><span class="c-who">'+pmEscape(n)+(t.profiles&&t.profiles.discipline?' <span class="meta" style="font-weight:400;">'+pmEscape(t.profiles.discipline)+"</span>":"")+"</span>"
+'<span style="display:flex;gap:8px;flex-wrap:wrap;"><a class="btn secondary small" href="messagerie.html?to='+t.applicant_id+"&project="+project.id+'">Écrire</a>'
+'<a class="btn secondary small" href="attestation.html?project='+project.id+"&partner="+t.applicant_id+'">Attestation</a></span></div>';}).join("")
+'<div class="cta-row left" style="margin-top:14px;"><a class="btn accent" href="espace.html?project='+project.id+'">Ouvrir l’espace de travail partagé</a><a class="btn secondary" href="collaborations.html">Mes collaborations</a></div></div>';
}}
const inst=project.owner_type==="institution";const prof=project.profiles||{};
const instHead=inst?'<p style="margin:0 0 6px;"><span class="org-badge">Institution</span></p>':"";
const instBits=[];if(inst){if(prof.org_kind)instBits.push(pmOrgKind(prof.org_kind));if(prof.country)instBits.push(pmEscape(prof.country));if(prof.contact_name)instBits.push(pmT("Contact : {c}").replace("{c}",pmEscape(prof.contact_name)));}
const instBlock=inst?('<div class="inst-block"><div class="ex-tag">Appel encadré par une institution</div><p>'+(instBits.length?instBits.join(" · ")+". ":"")+'Cet appel a un cadre administratif et une date limite. Lis-les avant de candidater : une fiche qui précise tout cela attend une candidature aussi précise.</p>'+pmInstFacts(project)+"</div>"):"";
contentEl.innerHTML=instHead+'<span class="eyebrow left">'+(inst?"Appel d’institution":"Fiche projet")+'</span>'+'<h1 style="text-align:left;">'+pmEscape(project.title)+"</h1>"+'<p class="meta">Par '+owner+(project.profiles&&project.profiles.university?" · "+pmEscape(project.profiles.university):"")+' · <span class="badge '+project.status+'">'+pmT(statusLabels[project.status])+"</span></p>"+instBlock+'<p class="sub">'+pmEscape(project.description)+"</p>"+(tags?'<div class="tags">'+tags+"</div>":"")+'<p class="meta" style="margin-top:12px;">'+(project.discipline?pmT(inst?"Domaine :":"Discipline du porteur :")+" "+pmEscape(project.discipline)+" · ":"")+(project.duration?pmT(inst?"Durée :":"Durée estimée :")+" "+pmEscape(project.duration)+" · ":"")+pmT("Publié le {d}").replace("{d}",pmFormatDate(project.created_at))+"</p>"+(isOwner?('<p class="empty-note">'+(inst?"C’est votre appel. Voici les candidatures reçues.":"C’est ton projet. Voici les candidatures reçues.")+"</p>"):"")+ownerWorkspaceHtml+applyHtml+(appsHtml?'<h2 class="section-title">Candidatures</h2>'+appsHtml:"");if(session&&!isOwner){const rz=document.createElement("p");rz.className="meta";rz.style.marginTop="24px";rz.innerHTML="Cette publication pose un problème ? "+pmReportLink("project",project.id);contentEl.appendChild(rz);}
attachApplyForm(project,session);attachWithdrawButton(project,session);await attachApplicationActions(project,session);pmBindReports(contentEl);}
(async()=>{const session=await pmInitNav(null);await render(session);})();
</script>
</body>
</html>
